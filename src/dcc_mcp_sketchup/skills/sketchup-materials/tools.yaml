tools:
  - name: list_materials
    description: List materials with display names, RGB colors, alpha, and texture paths.
    source_file: scripts/list_materials.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: create_material
    description: Create a named material with optional RGB color, alpha, and texture image.
    source_file: scripts/create_material.py
    input_schema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        color:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: integer, minimum: 0, maximum: 255}
        alpha: {type: number, minimum: 0, maximum: 1}
        texture_path: {type: string, minLength: 1}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false, open_world_hint: true, deferred_hint: false}
    call_examples:
      - arguments: {name: DCC_Red, color: [214, 52, 71], alpha: 1.0}
        note: Create an opaque red validation material

  - name: update_material
    description: Update a material name, color, alpha, or texture without arbitrary property access.
    source_file: scripts/update_material.py
    input_schema:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        new_name: {type: string, minLength: 1}
        color:
          type: array
          minItems: 3
          maxItems: 3
          items: {type: integer, minimum: 0, maximum: 255}
        alpha: {type: number, minimum: 0, maximum: 1}
        texture_path: {type: string, minLength: 1}
        clear_texture: {type: boolean, default: false}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: true, deferred_hint: false}

  - name: assign_material
    description: Assign a named material to the front, back, or both sides of an entity.
    source_file: scripts/assign_material.py
    input_schema:
      type: object
      required: [entity_id, material]
      properties:
        entity_id: {type: integer, minimum: 1}
        material: {type: string, minLength: 1}
        side: {type: string, enum: [front, back, both], default: front}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: remove_material
    description: Remove an unused material, refusing deletion while it is assigned anywhere.
    source_file: scripts/remove_material.py
    input_schema:
      type: object
      required: [name]
      properties: {name: {type: string, minLength: 1}}
      additionalProperties: false
    output_schema: {type: object}
    execution: sync
    affinity: main
    enforce_thread_affinity: true
    timeout_hint_secs: 30
    annotations: {read_only_hint: false, destructive_hint: true, idempotent_hint: false, open_world_hint: false, deferred_hint: false}
